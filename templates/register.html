<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - AI Health Advisor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="auth-container">
        <form action="/register" method="POST" class="auth-form">
            {% if alert_msg %}
    <div style="color: #ff4b4b; font-weight: bold; background: rgba(255, 75, 75, 0.1); padding: 10px; border: 1px solid #ff4b4b; border-radius: 5px; text-align: center; margin-bottom: 20px;">
        ⚠️ {{ alert_msg }}
    </div>
            {% endif %}
            <h2>Create Health Profile</h2>
            
            <input type="text" name="username" placeholder="Choose a Username" required>
            <input type="password" name="password" placeholder="Choose a Password" required>
            
            <h3>Personal Details</h3>
            <input type="text" name="name" placeholder="Full Name" required>
            <input type="number" name="age" placeholder="Age" required>
            
            <button type="submit">Create Account</button>
            <p>Already have an account? <a href="/login">Login</a></p>
        </form>
    </div>
</body>
</html>
